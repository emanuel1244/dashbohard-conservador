<div class="reporte-visual-container">
  <div class="header-section">
    <button class="btn-back" routerLink="/" title="Volver al Dashboard">
      ← Volver al Dashboard
    </button>
    <h2>Reporte de Lugares de Votación</h2>
  </div>
  
  <app-filtro-lider 
    [lideres]="lideres"
    [liderSeleccionado]="filtroLiderId"
    (liderSeleccionadoChange)="onLiderSeleccionado($event)">
  </app-filtro-lider>

  <div *ngIf="!cargando && distribucion.length > 0" class="contenido-reporte">
    <app-estadisticas-generales 
      [estadisticas]="estadisticas"
      (exportarPersonas)="exportarPersonasCompleto()">
    </app-estadisticas-generales>

    <app-acciones-exportacion
      [habilitado]="!cargando"
      (exportarExcel)="exportarExcel()"
      (exportarImagen)="exportarImagen()">
    </app-acciones-exportacion>

    <div class="visualizaciones">
      <app-tabla-distribucion 
        [distribucion]="distribucion"
        [cargando]="cargando"
        (verPersonasPorLugar)="mostrarPersonasPorLugar($event)"
        (descargarPersonasPorLugar)="descargarPersonasPorLugar($event)">
      </app-tabla-distribucion>

      <div class="graficas-container">
        <div id="grafica-barras">
          <app-grafica-barras 
            [distribucion]="distribucion"
            [cargando]="cargando">
          </app-grafica-barras>
        </div>

        <div id="grafica-pastel">
          <app-grafica-pastel 
            [distribucion]="distribucion"
            [cargando]="cargando">
          </app-grafica-pastel>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!cargando && distribucion.length === 0" class="mensaje-vacio">
    <p>{{ mensajeVacio }}</p>
  </div>

  <div *ngIf="cargando" class="loading-container">
    <span class="spinner"></span>
    <p>Cargando datos...</p>
  </div>

  <div *ngIf="error" class="mensaje-error">
    <p>{{ error }}</p>
    <button (click)="cargarDatos()" class="btn-reintentar">Reintentar</button>
  </div>

  <!-- Modal de Personas por Lugar -->
  <div *ngIf="mostrarModalPersonas" class="modal-overlay" (click)="cerrarModalPersonas()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>Personas en {{ lugarSeleccionado }}</h3>
        <button class="btn-close" (click)="cerrarModalPersonas()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-actions">
          <button class="btn-descargar-modal" (click)="descargarPersonasPorLugar(lugarSeleccionado)">
            📥 Descargar Excel
          </button>
          <span class="total-modal">Total: {{ personasLugarSeleccionado.length }} personas</span>
        </div>
        <div class="personas-list">
          <div *ngFor="let persona of personasLugarSeleccionado" class="persona-item">
            <div class="persona-nombre">{{ persona.nombre }}</div>
            <div class="persona-detalles">
              <span *ngIf="persona.cedula">Cédula: {{ persona.cedula }}</span>
              <span *ngIf="persona.celular">Tel: {{ persona.celular }}</span>
              <span *ngIf="persona.liderNombre">Líder: {{ persona.liderNombre }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
