<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <div class="logo-icon">PC</div>
        <h1>Partido Conservador</h1>
      </div>
      <h2>Panel de Líderes</h2>
      <p>Ingresa con tu cédula para acceder</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <div class="form-group">
        <label for="cedula">Cédula</label>
        <input 
          type="text" 
          id="cedula"
          [(ngModel)]="cedula" 
          name="cedula"
          placeholder="Número de cédula"
          [disabled]="cargando"
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password"
          [(ngModel)]="password" 
          name="password"
          placeholder="Últimos 4 dígitos de tu cédula"
          [disabled]="cargando"
          required>
        <small class="hint">Usa los últimos 4 dígitos de tu cédula</small>
      </div>

      <div *ngIf="error" class="error-message">
        ⚠️ {{error}}
      </div>

      <button 
        type="submit" 
        class="btn-login"
        [disabled]="cargando">
        {{cargando ? '⏳ Ingresando...' : '🔐 Ingresar'}}
      </button>

      <button 
        type="button" 
        class="btn-back"
        (click)="volverAlDashboard()"
        [disabled]="cargando">
        ← Volver al Dashboard
      </button>
    </form>

    <div class="login-footer">
      <p>¿Problemas para ingresar? Contacta al coordinador</p>
    </div>
  </div>
</div>
